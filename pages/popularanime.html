<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anime</title>
  </head>
  <body>
    <section>
      <h1>Popular Anime</h1>
      <p>Well-known anime series to explore.</p>
      <h2>Naruto</h2>
      <img src="/images/naruto-team-7.png" alt="naruto team 7" width="560" />
      <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/-G9BqkgZXRA?si=ivIP2AQ39X9k0PLL"
        title="YouTube video player"
        frameborder="0"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>

      <h2>Attack on Titan</h2>
      <img
        src="/images/attack-on-titan.jpg"
        alt="Attack on titan"
        width="560"
      />

        width="560"
        height="315"
        src="https://www.youtube.com/embed/LV-nazLVmgo?si=d7YXrOJ3I6zdK960"
        title="YouTube video player"
        frameborder="0"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
    </section>
  </body>
</html>
