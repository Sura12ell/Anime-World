<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback</title>
  </head>
  <body>
    <section>
      <h1>Share Your Favorite Anime</h1>
      <p>Tell us what you enjoy watching.</p>
      <form action="#" method="get">
        <label for="name">Name:</label><br />
        <input type="text" /> <br />
        <br />
        <label for="email">Email:</label> <br />
        <input type="email" placeholder="example@gmail.com" /> <br />
        <br />
        <label for="fav-anime">Favorite Anime:</label> <br />
        <input type="text" /> <br />
        <br />
        <label for="message">Your Message:</label> <br />
        <textarea name="message" rows="4" cols="40"></textarea> <br />
        <input type="Submit" />
      </form>
    </section>
  </body>
</html>
